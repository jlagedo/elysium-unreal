# Elysium map test bench.
#
# The pipeline's default export set. `export_all.py` with no map arguments exports
# exactly the maps listed under [test] below; `export_all.py --all` ignores this
# list and exports every .bsp in the install (~101 maps). Add or remove a line to
# change the bench.
#
# Each entry is a VtMB map name (a <name>.bsp under the install's maps/ folder),
# exported to tools/out/<name>/. Text after a `;` or `#` on a line is a comment.

[test]
# Technical benches (feature coverage the exporter/runtime are tuned against).
sm_hub_1          ; Santa Monica hub - animated lightstyles + heavy props/lights
sm_pawnshop_1     ; small interior - pawnshop / early haven
sp_tutorial_1     ; tutorial - patch-merged staging areas

# Community-acclaimed levels (the "best of VtMB" discourse - iconic set pieces
# giving the bench varied lighting, scale, and interior/exterior mixes).
sm_oceanhouse_1   ; Ocean House Hotel - GameSpy best PC level of 2004; horror set piece
la_malkavian_1    ; Grout's Mansion - eerie hallucination mansion (Malkavian primogen)
hw_609_1          ; Hallowbrook Hotel - Sabbat siege, large multi-floor combat interior
sp_giovanni_1     ; Giovanni Mansion - the wedding-massacre set piece
sp_observatory_1  ; Griffith Observatory - the werewolf encounter
ch_temple_1       ; Ming Xiao's Temple - Chinatown endgame temple
sp_soc_1          ; Society of Leopold Monastery - endgame
