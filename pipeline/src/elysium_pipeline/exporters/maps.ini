# Elysium map test bench.
#
# The pipeline's default export set. `export_all.py` with no map arguments exports
# exactly the maps listed under [test] below; `export_all.py --all` ignores this
# list and exports every .bsp in the install (~101 maps). Add or remove a line to
# change the bench.
#
# Each entry is a VtMB map name (a <name>.bsp under the install's maps/ folder),
# exported to $ELYSIUM_EXPORT_ROOT/<name>/. Text after a `;` or `#` on a line is a comment.

[test]
# Technical bench (feature coverage the exporter/runtime are tuned against).
sp_tutorial_1     ; tutorial - patch-merged staging areas

# sm_hub_1 (Santa Monica hub) and every map its trigger_changelevel volumes walk-connect
# to -- the district's full interior/exterior web, sharing the hub's animated lightstyles
# and heavy prop/light load. (`taxi` and `sewer_map`, sm_hub_1's other two changelevel
# targets, are not literal .bsp names -- vampire.dll substitutes an actual map for them at
# runtime -- so they're excluded here.)
sm_hub_1          ; Santa Monica hub
sm_diner_1        ; All-Night Diner
sm_bailbonds_1    ; Bail bonds office
sm_junkyard_1     ; Junkyard
sm_asylum_1       ; Asylum (Ash's)
sm_gallery_1      ; Gallery
sm_pawnshop_1     ; Player haven (above/behind the pawnshop)
sm_pawnshop_2     ; Pawnshop
sm_medical_1      ; Santa Monica clinic
sm_pier_1         ; The pier
sm_basement_1     ; Basement/sewer-adjacent interior
sm_apartment_1    ; Apartment interior
sm_warehouse_1    ; Warehouse
la_hub_1          ; LA hub (Downtown) - the other major district hub
sm_tattoo         ; Tattoo parlor
sm_vamparena      ; Vampire fight arena
sm_shreknet_1     ; Shreck's electronics/hacking shop
sm_oceanhouse_1   ; Ocean House Hotel - GameSpy best PC level of 2004; horror set piece
sm_coffee_1       ; Coffee shop
sm_smoke_1        ; Smoking Man Jazz Club
