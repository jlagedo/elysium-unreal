[/Script/Engine.WorldSettings]
; The frame's bound, which is VtMB's `Host_FilterTime` (engine.dll 0x2008ba30): host_frametime is
; clamped to host_timescale * [0.001, 0.1] before the game DLL ever sees curtime or frametime, so
; every consumer of the frame — thinks, queued I/O, movement, animation — shares one filtered delta
; and a hitch cannot advance one of them further than another.
;
; Epic's stock values are 0.0005 / 0.4 (Engine/Config/BaseGame.ini). Leaving the ceiling at 0.4 lets
; engine-tick consumers gain up to 0.3 s per long frame over the substrate clock, permanently.
;
; These must stay equal to ElysiumFrame::Min/MaxFrameSeconds (Source/ElysiumUE/Public/
; ElysiumGameClock.h), which FElysiumTimeControl::ApplyToWorld also writes here at map activation —
; the ini covers the frames before that runs, the code write covers whatever a baked .umap
; serialised. Elysium.Substrate.Movement pins the constants.
MinUndilatedFrameTime=0.001
MaxUndilatedFrameTime=0.1

[/Script/CommonInput.CommonInputSettings]
; CommonUI owns navigation/action routing, while UElysiumInputSubsystem remains the only writer of
; FInputMode and the cursor. A native input-data CDO keeps Back/Accept available without a binary
; content asset and disabling the fallback prevents CommonUI from installing a competing mode.
InputData=/Script/ElysiumUE.ElysiumCommonUIInputData
bEnableDefaultInputConfig=False

[CommonInputPlatformSettings_Windows CommonInputPlatformSettings]
; CommonInput selects one native glyph policy from the most recent GameInput hardware scope. The
; classes hold soft references to generated textures, so a missing policy export degrades to the
; existing text prompt with a warning instead of preventing the game from starting.
DefaultGamepadName=Xbox
+ControllerData=/Script/ElysiumUE.ElysiumKeyboardControllerData
+ControllerData=/Script/ElysiumUE.ElysiumXboxControllerData
+ControllerData=/Script/ElysiumUE.ElysiumDualSenseControllerData

; Baked assets carry their authoring-recipe hash as package metadata (bake_lib.RECIPE_TAG).
; Listing it here surfaces the tag through the asset registry, so a bake commandlet reads
; every asset's stamp off the registry scan without loading a single package. The class is
; `config=Game`, so this file is the one it reads.
[/Script/Engine.AssetManagerSettings]
