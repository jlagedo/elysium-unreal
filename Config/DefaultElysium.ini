; UElysiumSurfaceSettings (SF-4.1): the global surface-shading knobs a human tunes by eye in
; Project Settings -> Elysium -> Surfaces. TryUpdateDefaultConfigFile writes this file on every
; edit (no Ctrl+S needed); the values below are the class defaults, restated so a fresh checkout
; matches what a never-edited settings object reads.
; docs/architecture/seam_map_material.md -> "Import" -> "Knob contract".
[/Script/ElysiumUE.ElysiumSurfaceSettings]
DefaultSpecular=0.5
DefaultRoughness=0.6
DefaultMetallic=0.0
ClassInfluence=1.0
LightSpecularScale=1.0
Overbright=2.0
MaskRoughnessMin=0.08
MaskRoughnessMax=0.9
MaskSpecularScale=1.0
MaskMetallicMax=1.0
EnvTintScale=1.0
FixedCubeStrength=1.0
ChromaticTintStrength=1.0
ChromaThreshold=0.02
DecalDepthOffset=0.0
CaptureRadius=1500.0

; UElysiumModelSettings (R1.4): the model-import lane's LOD mapping knobs, a wiring default rather
; than a tuning judgement -- the owner's LOD pass happens on this page after the roadmap.
; docs/architecture/seam_map_model.md -> "Import" -> "Geometry".
[/Script/ElysiumUE.ElysiumModelSettings]
LodSwitchConstant=1.0
LodScreenSizeFloor=0.001
LodScreenSizeCeiling=0.9

; UElysiumMapTransportSettings (R4.6): the explicit per-map cutover flag. A listed map's entity/
; collision/environment resolvers read the baked DA_<map>_* assets; an unlisted map keeps the pre-R4
; sidecar path unchanged, regardless of whether an asset exists for it.
; docs/architecture/seam_map_map.md -> "## Import" -> "The explicit per-map cutover flag (R4.6)".
[/Script/ElysiumUE.ElysiumMapTransportSettings]
+MapsOnNewTransport=sm_pawnshop_1
+MapsOnNewTransport=sp_tutorial_1
+MapsOnNewTransport=sm_hub_1
+MapsOnNewTransport=sp_theatre
