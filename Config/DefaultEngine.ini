; VtMB's compact material class, `gamematerial` in scripts/surfaceproperties.txt: a single letter
; on 26 of the 63 entries, 17 distinct values. One EPhysicalSurface row per letter, assigned by
; alphabetical order of the letter so the mapping is derivable rather than remembered
; (SurfaceType1 = A ... SurfaceType17 = Y). The table is owned by
; `importers/surface_properties.GAME_MATERIAL_SURFACE_TYPES`, which is what stages the row name
; into each asset's sidecar; a pytest pins these rows against it.
;
; The rows map the *class*, not the entry. There is one UElysiumPhysicalMaterial asset per surface
; entry under /ElysiumBaked/SurfaceProperties, and a hit's PhysMaterial IS that asset, so entry
; identity needs no enum slot -- which is just as well, since the engine has 62 rows and the table
; has 63 entries. An entry with no `gamematerial` anywhere in its base chain stays
; SurfaceType_Default. See docs/architecture/seam_map_surface_property.md -> "Import".
