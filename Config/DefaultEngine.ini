; ElysiumUI::ScaleFor (an SDPIScaler at each screen root). SGameLayerManager wraps every
; AddToPlayerScreen widget in a second SDPIScaler driven by this curve. Pin the curve at 1
; so that wrapper is identity — otherwise PIE (editor DPI + a non-1080 viewport) multiplies
; the canvas a second time and the HUD reads oversized against `uv run elysium run play`.
[/Script/Engine.UserInterfaceSettings]
