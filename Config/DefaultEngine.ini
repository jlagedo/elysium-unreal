+SupportedAgents=(Name="TinyCentered",AgentRadius=20.32,AgentHeight=20.32,AgentStepHeight=45.72,NavWalkingSearchHeightScale=0.5,DefaultQueryExtent=(X=20.32,Y=20.32,Z=20.32),NavDataClass="/Script/NavigationSystem.RecastNavMesh")	; hull 7 TINY_CENTERED_HULL, cell 10
