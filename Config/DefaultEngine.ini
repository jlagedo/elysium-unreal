; The dedicated +use line-trace channel (P4.4). `ElysiumUse` is ECC_GameTraceChannel1, a
; trace type whose default response is Block — so world geometry and every solid brush body
; occlude the +use ray (a wall between the player and a button ends the trace) while the ray
; stays isolated from the ECC_Visibility channel the crosshair inspector and engine tooling
; use. FElysiumEntityWorld::UpdateUseCursor traces it and gates the hit on IsUsable.
;
; The debug click-pick channel (P2.6). `ElysiumPick` is ECC_GameTraceChannel2, a trace type whose
; default response is Ignore — only the baked level's render geometry opts in to blocking it. That
; isolation is the point: the walkable surface is the .hulls brush collider, which carries no
; material and no face, so a pick on any shared channel would report the invisible clip volume
; instead of the wall the player clicked.
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="ElysiumUse")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="ElysiumPick")
; The profile the baked level's world and sky geometry wears: visible, but invisible to every
; query except the debug pick. It is a named profile rather than per-channel edits on the
; component because only a profile name survives the .umap save/load round-trip -- loading
; re-applies the profile and discards any custom responses set alongside it. Every channel is
; listed explicitly: an omitted one falls back to its DefaultResponse above, which for
; ElysiumUse and Visibility is Block, and world geometry blocking those would occlude the +use
; ray and truncate the brush-body pick trace.
+Profiles=(Name="ElysiumPickOnly",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="ElysiumUse",Response=ECR_Ignore),(Channel="ElysiumPick",Response=ECR_Block)),HelpMessage="Baked world/sky geometry: drawn, but touched by nothing except the debug click-pick.",bCanModify=False)
; A solid GAME_LUMP prop: blocks like world geometry, occludes the +use ray, and is pickable.
+Profiles=(Name="ElysiumPropSolid",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldStatic",CustomResponses=((Channel="ElysiumUse",Response=ECR_Block),(Channel="ElysiumPick",Response=ECR_Block)),HelpMessage="Baked solid static prop: blocks the pawn, occludes +use, pickable.",bCanModify=False)

; Rendering: the world is lit entirely at runtime by the LightRig (hundreds of dynamic
; point/spot lights per map, no baked lightmaps), so the pipeline is fully dynamic —
; hardware-ray-traced Lumen for GI + reflections (runtime meshes have no offline distance
; fields, so software Lumen is out), MegaLights to make the many shadowed lights affordable,
; and Virtual Shadow Maps. Requires an RTX-class / DXR-capable GPU + SM6.
[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
; Hardware ray tracing hard-requires the GPU skin cache shaders to be compiled.
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.MegaLights.EnableForProject=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=False

; QUALITY BUDGET = the RTX 3060 floor at 1080p. We develop against the floor, not the dev
; machine — so these are the shipped defaults and a high-end GPU renders exactly what
; min-spec sees (a scale-UP tier for stronger GPUs comes later via the scalability system).
; [SystemSettings] forces them regardless of the auto-detected level, so the budget is
; deterministic. Cost is light shadowing + Lumen GI (hundreds of dynamic lights), not draw
; calls; MegaLights keeps the many-light cost ~constant, and Lumen GI is downsampled since
; VtMB interiors don't need full-res bounce.
; NOTE: this floor budget is validated by *look*, not fps, on a fast dev GPU (it'll always
; be fast here) — real floor-fps validation needs an actual 3060-class card.
[SystemSettings]
; MegaLights — constant-cost many-light shadowing; 4 of {2,4,16}.
r.MegaLights.NumSamplesPerPixel=4
; HWRT ray budget: cull distant instances, cap rays.
r.RayTracing.Culling=3
r.RayTracing.Culling.Radius=15000
; Reflections shade the material at the ray hit instead of reading Lumen's surface cache.
; Our geometry is built at runtime and carries no card representation, so it is absent from
; the surface cache (docs/lumen-coverage-spike.md) and every reflection hit reads back black —
; this cvar fires the second trace the engine reserves for exactly that case. Measured on
; sp_tutorial_1: the Reflection View goes from pure black to a fully lit scene for ~0.5 ms.
r.Lumen.Reflections.HardwareRayTracing.HitLighting=1
r.Lumen.HardwareRayTracing.MaxTraceDistance=10000
; Lumen GI cost reduction — TracingOctahedronResolution is the highest-impact knob.
; DownsampleFactor: Epic's BaseScalability buckets are Medium(@2)=32, High(@3)=16,
; Cine=8. 16 is the High/console tier — too rich for the weakest RT card, so the floor
; uses 32 (Medium). Bump to 16 if a real 3060 shows headroom.
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=2
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.IntegrateDownsampleFactor=2
; Lumen reflections — quarter-res tracing (interiors barely use these; Allow=0 -> SSR).
r.Lumen.Reflections.DownsampleFactor=2
; Clamp reflection ray intensity (default 100) so a single bright light sample can't
; become a crawling firefly on glossy surfaces — near-free, VtMB is near-Lambert.
r.Lumen.Reflections.MaxRayIntensity=10
; Recover detail lost to sub-100 render + TSR upscale — light post-pass sharpen, ~free.
r.Tonemapper.Sharpen=0.5
; VSM directional (sun) clipmap resolution bias. Large non-Nanite world surfaces (floors/
; walls/terrain are single PMC sections that can't be Nanite) each cover a big page area,
; overflowing the fixed-size per-group non-nanite marking-job queue. A coarser sun clipmap
; shrinks each mesh's page footprint so jobs stay under the queue — cutting shadow cost, not
; hiding it. ~invisible for VtMB's soft/low-detail shadows; raise toward 2.0 if it recurs.
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
; Render at 66% + TSR upscale — the biggest single saving. The main quality/perf dial:
; bump to 100 live in console to preview what a stronger GPU could show.
r.ScreenPercentage=66

; Force DX12 + Shader Model 6. Lumen, MegaLights, Virtual Shadow Maps, and hardware ray
; tracing ALL require SM6 — without this the renderer falls back to DX11/SM5 (PCD3D_SM5)
; and every one of those features is silently off. First launch after this recompiles the
; SM6 shader set (slow once, then cached).
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default

