; The dedicated +use line-trace channel (P4.4). `ElysiumUse` is ECC_GameTraceChannel1, a
; trace type whose default response is Block — so world geometry and every solid brush body
; occlude the +use ray (a wall between the player and a button ends the trace) while the ray
; stays isolated from the ECC_Visibility channel the crosshair inspector and engine tooling
; use. FElysiumEntityWorld::UpdateUseCursor traces it and gates the hit on IsUsable.
;
; The debug click-pick channel (P2.6). `ElysiumPick` is ECC_GameTraceChannel2, a trace type whose
; default response is Ignore — only the baked level's render geometry opts in to blocking it. That
; isolation is the point: the walkable surface is the .hulls brush collider, which carries no
; material and no face, so a pick on any shared channel would report the invisible clip volume
; instead of the wall the player clicked.

[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="ElysiumUse")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="ElysiumPick")
; The profile the baked level's world and sky geometry wears: visible, but invisible to every
; query except the debug pick. It is a named profile rather than per-channel edits on the
; component because only a profile name survives the .umap save/load round-trip -- loading
; re-applies the profile and discards any custom responses set alongside it. Every channel is
; listed explicitly: an omitted one falls back to its DefaultResponse above, which for
; ElysiumUse and Visibility is Block, and world geometry blocking those would occlude the +use
; ray and truncate the brush-body pick trace.
+Profiles=(Name="ElysiumPickOnly",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="ElysiumUse",Response=ECR_Ignore),(Channel="ElysiumPick",Response=ECR_Block)),HelpMessage="Baked world/sky geometry: drawn, but touched by nothing except the debug click-pick.",bCanModify=False)
; A solid GAME_LUMP prop: blocks like world geometry, occludes the +use ray, and is pickable.
+Profiles=(Name="ElysiumPropSolid",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldStatic",CustomResponses=((Channel="ElysiumUse",Response=ECR_Block),(Channel="ElysiumPick",Response=ECR_Block)),HelpMessage="Baked solid static prop: blocks the pawn, occludes +use, pickable.",bCanModify=False)
; PASSABLE doors remain addressable but do not obstruct actors or physics.
+Profiles=(Name="ElysiumBrushPassable",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="ElysiumUse",Response=ECR_Block),(Channel="ElysiumPick",Response=ECR_Block)),HelpMessage="PASSABLE brush entity: traversable, but usable and debug-pickable.",bCanModify=False)

; Rendering: the world is lit entirely at runtime by the LightRig (hundreds of dynamic
; point/spot lights per map, no baked lightmaps), so the pipeline is fully dynamic —
; hardware-ray-traced Lumen for GI + reflections, MegaLights to make the many shadowed lights
; affordable, and Virtual Shadow Maps. The baked meshes carry Nanite but no mesh distance
; fields, so hardware ray tracing is the only tracing path — there is no software-Lumen
; fallback and a DXR-capable GPU + SM6 is required.

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
; Hardware ray tracing hard-requires the GPU skin cache shaders to be compiled.
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.MegaLights.EnableForProject=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=False

; NPC navigation is generated after the sidecar world collision finishes cooking. Nothing is
