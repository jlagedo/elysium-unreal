; same runtime hull/displacement collision the player stands on.
[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
bForceRebuildOnLoad=True

; QUALITY TIER = RTX 4060-class, 16 GB, 1440p native, 60 fps. Forced here rather than left to
; the first-run hardware benchmark, so every machine renders the same frame and any look change
; is a content change. [SystemSettings] is the right home for that: ECVF_SetBySystemSettingsIni
; (0x05) outranks ECVF_SetByScalability (0x02) and ECVF_SetByGameSetting (0x03), so neither the
; benchmark nor a settings menu can pull these down.
;
; The tier is Epic (3) across the board. Epic's guidance is to use the stock scalability levels
; rather than a hand-rolled cvar set, because the buckets are tuned to hold indirect lighting
; consistent as they scale; each `sg.` line pulls in the matching block of
; Engine/Config/BaseScalability.ini — ~45 cvars for GI alone. Only deliberate deviations are
; listed under them.
;
; Cost is light shadowing + Lumen GI (hundreds of dynamic lights), not draw calls or triangles:
; MegaLights keeps the many-light cost ~constant, and the world is ~20k triangles.

[SystemSettings]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=3
sg.TextureQuality=3
sg.EffectsQuality=3
sg.FoliageQuality=3
sg.ShadingQuality=3

; --- deviations from the Epic bucket ---

; HWRT scene culling. A VtMB map is one interior a few hundred metres across, so a 150 m radius
; reaches the whole playable space and the cull only ever drops the 3D-skybox shell (itself
; already excluded from ray tracing by the bake). These are Epic's documented starting values
; for a scene that needs reflection coverage at range.
r.RayTracing.Culling=3
r.RayTracing.Culling.Radius=15000
r.RayTracing.Culling.Angle=0.5

; 16x anisotropic filtering; the Epic bucket stops at 8. VtMB's framing is long grazing-angle
; views down alleys and corridor floors, which is exactly where 8x still smears. Negligible cost
; on a card in this class.
r.MaxAnisotropy=16
r.VT.MaxAnisotropy=16

; Texture streaming pool, 3x the Epic bucket's 1000 MB. A map carries ~700 textures; the 16 GB
; floor has the headroom to hold a whole map resident so mips never pop in.
r.Streaming.PoolSize=3000

; Force DX12 + Shader Model 6. Lumen, MegaLights, Virtual Shadow Maps, and hardware ray
; tracing ALL require SM6 — without this the renderer falls back to DX11/SM5 (PCD3D_SM5)
; and every one of those features is silently off. First launch after this recompiles the
; SM6 shader set (slow once, then cached).

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default

