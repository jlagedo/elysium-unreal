name: repository-policy

on:
  workflow_dispatch:

jobs:
  policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run elysium doctor --repo-only
      - run: uv run python -m compileall -q pipeline/src research dev tools
      # One run covers both suites: `testpaths` in pyproject names them, and the Blender add-on's
      # core is bpy-free precisely so it runs here without an install. Its Blender-side tests live
      # under tests/blender, which `norecursedirs` keeps out of collection.
      - run: uv run pytest -q
