name: repository-policy

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run elysium doctor --repo-only
      - run: uv run python -m compileall -q pipeline/src research dev
      - run: uv run python -m unittest discover -s pipeline/tests -v
